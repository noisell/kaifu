version: "3.9"

services:
  redis:
    image: redis:6
    container_name: redis_app
    command: --port 6380
    restart: always
    expose:
      - 6380
    networks:
      - main

  celery:
    build:
      context: .
    container_name: celery
    command: [ "/celery.sh", "celery" ]
    env_file:
      - .env-prod
    depends_on:
      - redis
    networks:
      - main

  bot:
    build:
      context: .
      dockerfile: Dockerfile

    restart: always
    container_name: bot
    env_file:
      - .env-prod
    depends_on:
      - redis
    command: ["python", "-m", "bot.main"]
    networks:
      - main

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: backend
    restart: always
    env_file:
      - .env-prod
    ports:
      - "8000:8000"
    depends_on:
      - redis
      - celery
    command: ["/start.sh"]
    networks:
      - main

  consumer:
    build:
      context: .
      dockerfile: Dockerfile

    restart: always
    container_name: consumer
    env_file:
      - .env-prod
    command: [ "python", "-m", "src.task.consumer" ]
    depends_on:
      - redis
    networks:
      - main

networks:
  main: